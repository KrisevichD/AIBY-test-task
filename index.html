<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AIBY</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/iphone8plus.css" />
    <link rel="stylesheet" href="./styles/iphone12.css" />
    <link rel="stylesheet" href="./styles/iphone8.css" />
    <script src="./scripts/main.js" type="module"></script>
</head>
<body>
    <div class="main">
        <a href="#" class="cross-btn">
            <img src="./assets/images/cross.svg" alt="close" class="cross-btn__img">
        </a>
    <div class="main__container">
    <h1 class="main__title title" data-i18n="Get Unlimited Access">Get Unlimited <br>Access</h1>
    <div class="main__advantages advantages">
        <div class="advantages__card advantages__card--1">
            <p class="advantages__text">Unlimited Art <br>Creation</p>
        </div>
        <div class="advantages__card advantages__card--2">
            <p class="advantages__text">Exclusive <br>Styles</p>
        </div>
        <div class="advantages__card advantages__card--3">
            <p class="advantages__text">Magic Avatars <br>With 20% Off</p>
        </div>
    </div>
    <form action="" class="main__form form">
        <div class="form__cell purchase">
            <input class="purchase__input purchase__input--hidden" type="radio" name="purchase" id="apple">
            <label class="purchase__block" for="apple">
                <div class="purchase__column">
                    <div class="purchase__title">YEARLY ACCESS</div>
                    <div class="purchase__subtitle">Just $39.99 per year</div>
                </div>
                <div class="purchase__text">$0.48 <br>per week</div>
            </label>
            <div class="purchase__banner banner">
                <div class="banner__left-stroke"></div>
                <div class="banner__block">BEST OFFER</div>
                <div class="banner__right-stroke"></div>
            </div>
        </div>
        <div class="form__cell purchase">
            <input class="purchase__input purchase__input--hidden" type="radio" name="purchase" id="google">
            <label class="purchase__block" for="google">
                <div class="purchase__title">WEEKLY ACCESS</div>
                <div class="purchase__text">$6.99 <br>per week</div>
            </label></div>
        <a href="#" class="form__cell form__cell--offset button--submit">
            Continue
        </a>
    </form>
    <div class="main__footer footer">
        <a href="#" class="footer__link">Terms of Use</a>
        <a href="#" class="footer__link">Privacy Policy</a>
        <a href="#" class="footer__link">Restore</a>
    </div>
</div>
</div>
</body>
</html>
